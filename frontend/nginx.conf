server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router pakai BrowserRouter -> semua route non-file harus fallback
    # ke index.html, kalau tidak, refresh di /orders/123 akan 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}